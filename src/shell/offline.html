<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <title>Messenger</title>
  <style>
    :root { color-scheme: light dark; }
    html, body { height: 100%; margin: 0; }
    body {
      display: grid; place-items: center;
      font: 15px/1.4 "Segoe UI", system-ui, sans-serif;
      background: Canvas; color: CanvasText;
    }
    main { text-align: center; max-width: 360px; padding: 24px; }
    h1 { font-size: 20px; margin: 0 0 8px; }
    p { margin: 0 0 20px; opacity: .7; }
    button {
      font: inherit; font-weight: 600; color: #fff; background: #0866ff;
      border: 0; border-radius: 6px; padding: 8px 20px; cursor: pointer;
    }
    button:hover { background: #0759d6; }
  </style>
</head>
<body>
  <main>
    <h1>Can't reach Messenger</h1>
    <p id="reason">Check your internet connection. The app will try again automatically.</p>
    <button id="retry">Try again</button>
  </main>
  <script>
    const params = new URLSearchParams(location.search);
    const target = params.get('url') || 'https://www.facebook.com/messages/';
    const retry = () => { location.href = target; };
    document.getElementById('retry').addEventListener('click', retry);
    window.addEventListener('online', retry);
    setTimeout(retry, 15000);
  </script>
</body>
</html>
