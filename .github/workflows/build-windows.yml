# Builds the Windows installer on GitHub's Windows machines. When SignPath
# is set up (secret SIGNPATH_API_TOKEN, variable SIGNPATH_ORGANIZATION_ID),
# the app's .exe and then the installer are sent to SignPath for signing;
# each request waits until it is approved on signpath.io. Without them the
# installer is built unsigned. A pushed version tag creates a signed release.
name: Build Windows app

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Create or update this release (for example v1.4.0). Leave empty to only build.
        required: false
        default: ''

permissions:
  actions: read
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      SIGNING: ${{ secrets.SIGNPATH_API_TOKEN != '' && vars.SIGNPATH_ORGANIZATION_ID != '' && 'true' || 'false' }}
      SIGNPATH_TOKEN_CONFIGURED: ${{ secrets.SIGNPATH_API_TOKEN != '' && 'true' || 'false' }}
      SIGNPATH_ORGANIZATION_CONFIGURED: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' && 'true' || 'false' }}
      RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.release_tag }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Require signing for release builds
        run: |
          if ($env:SIGNPATH_TOKEN_CONFIGURED -ne $env:SIGNPATH_ORGANIZATION_CONFIGURED) {
            throw 'SignPath is only partly configured. Set both SIGNPATH_API_TOKEN and SIGNPATH_ORGANIZATION_ID.'
          }
          if (-not [string]::IsNullOrWhiteSpace($env:RELEASE_TAG) -and $env:SIGNING -ne 'true') {
            throw 'Release builds must be signed. Configure SignPath before setting release_tag.'
          }
          if (-not [string]::IsNullOrWhiteSpace($env:RELEASE_TAG)) {
            $version = node -p "require('./package.json').version"
            $expectedTag = "v$version"
            if ($env:RELEASE_TAG -ne $expectedTag) {
              throw "Release tag $env:RELEASE_TAG does not match package version $expectedTag."
            }
          }

      - run: npm ci

      - name: Build the app folder
        run: npx electron-builder --win --dir --publish never

      - name: Upload the app .exe for signing
        if: env.SIGNING == 'true'
        id: upload-app
        uses: actions/upload-artifact@v4
        with:
          name: app-unsigned
          path: dist/win-unpacked/MessengerClassic.exe

      - name: Sign the app .exe (approve it on signpath.io)
        if: env.SIGNING == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'messenger-classic' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY || 'release-signing' }}
          artifact-configuration-slug: app
          github-artifact-id: ${{ steps.upload-app.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed-app

      - name: Put the signed .exe back
        if: env.SIGNING == 'true'
        run: Copy-Item signed-app/MessengerClassic.exe dist/win-unpacked/MessengerClassic.exe -Force

      - name: Build the installer from the app folder
        run: npx electron-builder --win nsis --prepackaged dist/win-unpacked --publish never

      - name: Find the installer
        id: installer
        run: |
          $version = node -p "require('./package.json').version"
          "name=MessengerClassic-Setup-$version.exe" >> $env:GITHUB_OUTPUT

      - name: Upload the installer for signing
        if: env.SIGNING == 'true'
        id: upload-installer
        uses: actions/upload-artifact@v4
        with:
          name: installer-unsigned
          path: dist/${{ steps.installer.outputs.name }}

      - name: Sign the installer (approve it on signpath.io)
        if: env.SIGNING == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'messenger-classic' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY || 'release-signing' }}
          artifact-configuration-slug: installer
          github-artifact-id: ${{ steps.upload-installer.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed-installer

      - name: Put the signed installer back
        if: env.SIGNING == 'true'
        run: Copy-Item "signed-installer/${{ steps.installer.outputs.name }}" "dist/${{ steps.installer.outputs.name }}" -Force

      - name: Rebuild the blockmap and latest.yml for the final installer
        run: node scripts/finish-installer.js "dist/${{ steps.installer.outputs.name }}"

      - name: Verify the signatures
        run: |
          foreach ($f in 'dist/win-unpacked/MessengerClassic.exe', "dist/${{ steps.installer.outputs.name }}") {
            $s = Get-AuthenticodeSignature $f
            "{0}: {1} {2}" -f $f, $s.Status, $s.SignerCertificate.Subject
            if ($env:SIGNING -eq 'true' -and $s.Status -ne 'Valid') {
              throw "$f does not have a valid Authenticode signature (status: $($s.Status))."
            }
          }

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.SIGNING == 'true' && 'MessengerClassic-windows-signed' || 'MessengerClassic-windows-unsigned' }}
          path: |
            dist/${{ steps.installer.outputs.name }}
            dist/${{ steps.installer.outputs.name }}.blockmap
            dist/latest.yml

      - name: Create the release if necessary
        if: env.RELEASE_TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$env:RELEASE_TAG" *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create "$env:RELEASE_TAG" --verify-tag --title "Messenger Classic $env:RELEASE_TAG" --generate-notes
          }

      - name: Attach to the release
        if: env.RELEASE_TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$env:RELEASE_TAG" "dist/${{ steps.installer.outputs.name }}" "dist/${{ steps.installer.outputs.name }}.blockmap" dist/latest.yml --clobber
