<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; img-src https: data: http://localhost:*; style-src 'self'; script-src 'self'">
  <title>Messenger</title>
  <link rel="stylesheet" href="shell.css">
</head>
<body>
  <!-- Title bar (part=title) -->
  <header class="titlebar">
    <svg class="app-icon" viewBox="0 0 32 32" aria-hidden="true">
      <circle class="disc" cx="16" cy="16" r="16"/>
      <path fill="#fff" d="M16 7.5c-5.1 0-9.2 3.6-9.2 8.1 0 2.4 1.2 4.6 3.1 6.1v3.4l3.2-1.8c.9.2 1.9.4 2.9.4 5.1 0 9.2-3.6 9.2-8.1S21.1 7.5 16 7.5z"/>
      <circle class="dot" cx="11.6" cy="15.6" r="1.4"/>
      <circle class="dot" cx="16" cy="15.6" r="1.4"/>
      <circle class="dot" cx="20.4" cy="15.6" r="1.4"/>
    </svg>
    <span class="app-name">Messenger</span>
  </header>

  <!-- Sidebar (part=rail) -->
  <nav class="rail" aria-label="Messenger">
    <div class="rail-top">
      <button class="item" data-route="chats" title="Chats">
        <span class="icon">
          <svg viewBox="0 0 24 24"><path d="M12 3.2c-4.97 0-9 3.55-9 7.93 0 2.38 1.19 4.51 3.07 5.97v3.7l3.27-1.8c.83.2 1.73.3 2.66.3 4.97 0 9-3.55 9-7.93S16.97 3.2 12 3.2z"/></svg>
          <span class="badge" hidden></span>
        </span>
        <span class="label">Chats</span>
      </button>
      <button class="item" data-route="requests" title="Message requests">
        <span class="icon">
          <svg viewBox="0 0 24 24"><path d="M12 3.2c-4.97 0-9 3.55-9 7.93 0 2.38 1.19 4.51 3.07 5.97v3.7l3.27-1.8c.83.2 1.73.3 2.66.3 4.97 0 9-3.55 9-7.93S16.97 3.2 12 3.2z"/><path class="dots" d="M8 11.2h.01M12 11.2h.01M16 11.2h.01"/></svg>
        </span>
        <span class="label">Requests</span>
      </button>
      <button class="item" data-route="archived" title="Archived chats">
        <span class="icon">
          <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="4.5" rx="1.3"/><path d="M4.8 8.5v10a1.5 1.5 0 0 0 1.5 1.5h11.4a1.5 1.5 0 0 0 1.5-1.5v-10M9.8 12.5h4.4"/></svg>
        </span>
        <span class="label">Archive</span>
      </button>
    </div>

    <div class="rail-bottom">
      <button class="item" id="theme" title="Theme">
        <span class="icon">
          <svg viewBox="0 0 24 24"><path d="M12 3.2a8.8 8.8 0 1 0 0 17.6c1.05 0 1.75-.78 1.75-1.68 0-.45-.17-.86-.47-1.17-.29-.3-.46-.7-.46-1.15 0-.94.76-1.7 1.7-1.7h2.02A4.66 4.66 0 0 0 20.8 10.4C20.8 6.4 16.86 3.2 12 3.2z"/><circle class="fill" cx="7.6" cy="11.2" r="1.25"/><circle class="fill" cx="10.4" cy="7.6" r="1.25"/><circle class="fill" cx="14.8" cy="7.6" r="1.25"/><circle class="fill" cx="17.2" cy="10.9" r="1.25"/></svg>
        </span>
        <span class="label">Theme</span>
      </button>
      <button class="item" id="settings" title="Preferences">
        <span class="icon avatar">
          <img alt="" referrerpolicy="no-referrer" hidden>
          <svg class="avatar-fallback" viewBox="0 0 24 24"><circle cx="12" cy="9" r="3.6"/><path d="M5.5 19.2c1.2-3 3.7-4.4 6.5-4.4s5.3 1.4 6.5 4.4"/></svg>
        </span>
        <span class="label">Preferences</span>
      </button>
      <button class="item" id="collapse" title="Expand sidebar">
        <span class="icon">
          <svg viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="2.5"/><path d="M9.5 4.5v15"/></svg>
        </span>
        <span class="label">Collapse</span>
      </button>
    </div>
  </nav>

  <script src="shell.js"></script>
</body>
</html>
